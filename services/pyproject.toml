[project]
name = "whill-services"
version = "0.1.0"
description = "whill_platform の CLI と常駐サービス (ROS ノードではないもの)"
requires-python = ">=3.10,<3.11"
license = { text = "BSD-3-Clause" }
dependencies = [
    # numpy<2 を固定する。ROS humble の rclpy / cv_bridge は numpy 1.x ABI で
    # ビルドされており、2.x を入れると同一プロセスで import した瞬間に落ちる。
    "numpy<2",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "websockets>=12.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
whill = "whill_cli.main:app"
whill-stackd = "whill_stackd.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whill_cli", "whill_stackd"]

[tool.uv]
# ROS の rclpy とプロセスを共有する可能性があるため、システム python3.10 を使う。
# uv python install で別の 3.10 を持ってくると rclpy が import できない。
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["../tests/services"]
asyncio_mode = "auto"
# ROS を source した shell では PYTHONPATH に /opt/ros/humble/.../site-packages が
# 入る。pytest はそこに登録された ROS 製プラグイン (launch_pytest 等) を自動 load
# しようとし、uv の venv に無い依存 (lark) を要求して collection 前に落ちる。
# ini の `-p no:` は pytest が entrypoint を load した後に読まれるため効かない。
# 唯一効くのは環境変数なので、scripts/test.sh がそれを export して走らせる。
# 直接 pytest を叩くときも PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 を付けること。
