# cr2-01 — 個体差。cr2-base.yaml を上書きする。
#
# この個体はまだ手元にない。tf_static とハードウェア識別子は cr2-01 からの
# 暫定コピーであり、measured は全て false。実車が来たら採寸して置き換えること
# （docs/open-questions.md の実機検証待ちリストに登録済み）。

schema_version: 1
robot_id: cr2-03
display_name: CR2-03
model: WHILL Model CR2
ros_domain_id: 23

hardware:
  whill_serial:
    # udev で VID:PID 067b:2303 から張る symlink。ポート番号は使わない
    # （USB ポートを差し替えると /dev/ttyUSB* の番号が動くため）。
    port: /dev/whill-03
    baudrate: 38400
    stop_bits: 2
    publish_interval_ms: 400
  velodyne:
    device_ip: 192.168.1.203
    host_ip: 192.168.1.100
    host_interface: null   # 実車の USB-Ethernet アダプタ未定
    port: 2368
    model: VLP16
  rt_9axis:
    # RT-USB-9AXIS-00。CDC-ACM (usb-serial ではない)、VID:PID 2b72:0003。
    # デバイスが名乗る serial "9AXIS-00" は型番であって個体 ID ではないので、
    # udev は VID:PID で symlink を張っている。
    port: /dev/imu-03
    frame_id: imu_link
  realsense:
    serial: null            # 未取得。実機復帰後に rs-enumerate-devices で確認する
    model: D435

# base_link 基準の静的 TF。単位は m / rad。
tf_static:
  # cr2-01 の値を仮置きしてある（同型のため）。**実車が来たら採寸して置き換える。**
  # 値の出どころは cr2-01.yaml と同じ（既存スタックの static_tf_launch.py）。
  imu_link:
    parent: base_link
    xyz: [0.38, -0.03, 0.47]
    rpy: [-0.0713, -0.1415, 0.0]
    measured: false
    note: cr2-01 の値（2026-07-10 に cr2-01 の実車で採寸したもの）の仮置き。**この個体では採寸していない。** 実車が来たら採寸して置き換える。
  velodyne:
    parent: base_link
    xyz: [0.484136, 0.381548, 0.793704]
    rpy: [-0.035342, 0.156983, -0.005527]
    measured: false
    note: cr2-01 の値の仮置き。元は採寸値ではなく、noetic の LiDAR<->IMU 外部パラメータを imu_link の位置に足した合成値。**この個体では未確認。**
  camera_link:
    parent: base_link
    xyz: [0.54, 0.382, 0.79]
    rpy: [0.0, 0.0, 0.0]
    measured: false
    note: cr2-01 の値の仮置き。親は base_link（既存スタックと同じ）。姿勢は identity 仮置きで、**この個体では未確認。**
  # base_footprint は置かない。**既存スタックが publish しておらず、Nav2 の
  # robot_base_frame も base_link。** 誰も使わないフレームを宣言すると、
  # tf パネル（#51）が毎回「来ていない」と出す。接地面が要るときに入れる。

# cr2-base の telemetry 閾値をこの個体だけ上書きする場合に書く。
telemetry_overrides: {}

# この個体に紐づく地図。既存リポの成果物を参照する。
maps:
  default: campus_v2
  campus_v2:
    source_repo: ~/whill_lab0_ros2
    # 既存スタックの localizer に渡す site 名（あちらの nav_launch / m6r_bringup の
    # `site:=` と同じもの）。**地図のパスから推測しない。**
    site: campus
    # 実在するパスであることは tests/services/test_maps.py が確かめる。
    # 以前は docs/maps/campus/v2/occupancy_v2.yaml と 1 階層ずれていた。
    # 既存リポの runbook は「map_variant:=v2 は必須」（旧 occupancy.yaml には
    # 焼き込みの残りがある）なので、v2 を使う。
    occupancy: docs/maps/campus/occupancy_v2.yaml
    # 配車の地点。cr2-01 と同じものを仮置き（同じ site を走る前提）。
    waypoints: docs/maps/campus/waypoints.yaml
