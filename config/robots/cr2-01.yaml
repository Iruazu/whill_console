# cr2-01 — 個体差。cr2-base.yaml を上書きする。
#
# TF の数値は 2026-05-22 に実車で採寸したもの（Phase A-2）。
# 未採寸の項目は tf_static 内に "measured: false" を明示している。推測値を
# 採寸値と同じ顔で置かないこと。

schema_version: 1
robot_id: cr2-01
display_name: CR2-01
model: WHILL Model CR2
ros_domain_id: 21

hardware:
  whill_serial:
    # udev で VID:PID 067b:2303 から張る symlink。ポート番号は使わない
    # （USB ポートを差し替えると /dev/ttyUSB* の番号が動くため）。
    port: /dev/whill
    baudrate: 38400
    stop_bits: 2
    publish_interval_ms: 400
  velodyne:
    device_ip: 192.168.1.201
    host_ip: 192.168.1.100
    host_interface: enx00e04c6808dc
    port: 2368
    model: VLP16
  rt_9axis:
    # RT-USB-9AXIS-00。CDC-ACM (usb-serial ではない)、VID:PID 2b72:0003。
    # デバイスが名乗る serial "9AXIS-00" は型番であって個体 ID ではないので、
    # udev は VID:PID で symlink を張っている。
    port: /dev/imu
    frame_id: imu_link
  realsense:
    serial: null            # 未取得。実機復帰後に rs-enumerate-devices で確認する
    model: D435

# base_link 基準の静的 TF。単位は m / rad。
tf_static:
  # **値は既存スタック（~/whill_lab0_ros2）の static_tf_launch.py が正。**
  # ここは写しであって、こちらで決めた値ではない。既存スタックが実車を走らせて
  # いるので、食い違ったら本リポ側のバグ（CLAUDE.md「既存スタックとの関係」）。
  # 代表 bag（2026-07-31）の /tf_static とも一致することを確認済み。
  # 写した日: 2026-09-16（#51 の tf パネルが食い違いを検出したため）
  imu_link:
    parent: base_link
    xyz: [0.38, -0.03, 0.47]
    rpy: [-0.0713, -0.1415, 0.0]
    measured: true
    note: >-
      2026-07-10 に実車で再採寸した値（既存リポ Issue #61）。roll -4.09deg /
      pitch -8.11deg。以前ここに書いていた [0.20, 0.0, 0.42] / rpy 0 は
      noetic 時代の古い値で、実機ともbagとも違っていた。
  velodyne:
    parent: base_link
    xyz: [0.484136, 0.381548, 0.793704]
    rpy: [-0.035342, 0.156983, -0.005527]
    measured: false
    note: >-
      採寸値ではなく合成値。noetic の LiDAR<->IMU 外部パラメータを、再採寸した
      imu_link の位置に足して base_link 基準に直したもの（既存リポの
      static_tf_launch.py に導出が書いてある）。LiDAR は IMU と同じ機構に
      共締めされており、相対は動いていない前提。
  camera_link:
    parent: base_link
    xyz: [0.54, 0.382, 0.79]
    rpy: [0.0, 0.0, 0.0]
    measured: false
    note: >-
      **親は velodyne ではなく base_link。** 既存スタックも bag もそうなっている。
      値は簡易測定（LiDAR よりわずかに前方、y/z は LiDAR と同等）で、姿勢は
      identity 仮置き。既存リポに target-based キャリブの TODO が残っている。
      カメラは Nav2 の入力ではないので、当面この精度で困らない。
  # base_footprint は置かない。**既存スタックが publish しておらず、Nav2 の
  # robot_base_frame も base_link。** 誰も使わないフレームを宣言すると、
  # tf パネル（#51）が毎回「来ていない」と出す。接地面が要るときに入れる。

# cr2-base の telemetry 閾値をこの個体だけ上書きする場合に書く。
telemetry_overrides: {}

# この個体に紐づく地図。既存リポの成果物を参照する。
maps:
  default: campus_v2
  campus_v2:
    source_repo: ~/whill_lab0_ros2
    occupancy: docs/maps/campus/v2/occupancy_v2.yaml
    # 配車の名前付き地点。occupancy と同じ map frame の座標系。
    # パスから site を推測せず明示するのは、地図を差し替えたときに
    # 地点だけ古いまま残るのを防ぐため。
    waypoints: docs/maps/campus/waypoints.yaml
